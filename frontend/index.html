<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mutual Fund FAQ Assistant — Groww (Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --green: #00b386;
    --green-bright: #00d09c;
    --green-dark: #00946e;
    --green-tint: #e3f9f1;
    --green-tint-2: #eafbf6;
    --ink: #121828;
    --secondary: #44475b;
    --muted: #687083;
    --faint: #9aa3b2;
    --border: #eceff3;
    --border-2: #e6eaf0;
    --app-bg: #fafbfc;
    --error: #ff4d4f;
    --blue: #2a6fdb;
    --card: #ffffff;
    --surface-2: #fafbfc;
    --chip-bg: #f6f7f9;
    --danger-tint: #ffeaea;
    --green-border: #c8f0e2;
    --shadow-card: 0 1px 2px rgba(16,24,40,.04), 0 8px 28px rgba(16,24,40,.06);
    --shadow-soft: 0 2px 14px rgba(16,24,40,.05);
  }

  html[data-theme="dark"] {
    --green: #00c993;
    --green-bright: #00d09c;
    --green-dark: #57e0bd;
    --green-tint: rgba(0,208,156,.16);
    --green-tint-2: rgba(0,208,156,.13);
    --ink: #f3f6fb;
    --secondary: #b3bcca;
    --muted: #8b94a4;
    --faint: #6b7484;
    --border: #232a36;
    --border-2: #2c3340;
    --app-bg: #0b0e13;
    --error: #ff6b6d;
    --blue: #6ea8ff;
    --card: #141922;
    --surface-2: #1b212b;
    --chip-bg: #1e242f;
    --danger-tint: rgba(255,77,79,.16);
    --green-border: rgba(0,208,156,.34);
    --shadow-card: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
    --shadow-soft: 0 2px 14px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  html { transition: none; }
  body, .btn-outline, .btn-google, .popular-card, .login-card, .empty-ex,
  .chat-header, .chat-banner, .bot-bubble, .chip, .chat-input { transition: background-color .25s ease, border-color .25s ease, color .25s ease; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    color: var(--ink);
    background: var(--app-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { height: 100%; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input { font-family: inherit; }
  a { color: inherit; }

  .screen { min-height: 100%; display: flex; flex-direction: column; }

  /* ---------- buttons ---------- */
  .btn-primary {
    background: var(--green); color: #fff; font-weight: 600; font-size: 15px;
    border-radius: 999px; padding: 14px 22px; display: inline-flex; align-items: center;
    justify-content: center; gap: 10px; transition: background .15s, transform .1s, box-shadow .15s;
    box-shadow: 0 6px 16px rgba(0,179,134,.22);
  }
  .btn-primary:hover { background: #009e76; }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary:disabled { background: #b7e7d8; box-shadow: none; cursor: not-allowed; }
  .btn-lg { height: 54px; font-size: 16px; }
  .btn-block { width: 100%; height: 52px; }

  .btn-outline {
    background: var(--card); color: var(--secondary); font-weight: 600; font-size: 15px;
    border: 1.5px solid var(--border-2); border-radius: 999px; padding: 13px 22px;
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    transition: border-color .15s, background .15s;
  }
  .btn-outline:hover { border-color: #cdd4de; background: var(--surface-2); }
  .btn-login-top { color: var(--green); border-color: var(--green); padding: 9px 26px; font-size: 14px; }
  .btn-login-top:hover { background: var(--green-tint); border-color: var(--green); }

  /* ---------- nav ---------- */
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 26px; max-width: 1100px; width: 100%; margin: 0 auto;
  }
  .link-back { color: var(--muted); font-size: 14px; font-weight: 500; padding: 6px 4px; }
  .link-back:hover { color: var(--ink); }

  .nav-right { display: flex; align-items: center; gap: 12px; }
  .theme-toggle {
    width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--border-2);
    background: var(--card); color: var(--secondary); display: flex; align-items: center;
    justify-content: center; transition: background .15s, border-color .15s, color .15s;
  }
  .theme-toggle:hover { border-color: var(--green); color: var(--green); background: var(--green-tint); }
  .logo-btn { display: inline-flex; align-items: center; background: none; border: none; padding: 0; }

  /* ---------- facts badge ---------- */
  .facts-badge {
    display: inline-flex; align-items: center; gap: 7px; background: var(--green-tint);
    color: var(--green-dark); font-size: 13px; font-weight: 600; padding: 7px 14px;
    border-radius: 999px; width: fit-content;
  }

  .proto-note {
    display: flex; align-items: center; gap: 7px; color: var(--faint);
    font-size: 12.5px; font-weight: 500; justify-content: center;
  }
  .landing-foot { padding: 22px; border-top: 1px solid var(--border); margin-top: auto; }

  /* ===================== LANDING ===================== */
  .landing-main {
    max-width: 620px; width: 100%; margin: 0 auto; padding: 18px 26px 60px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 22px;
  }
  .hero-title {
    font-size: 52px; line-height: 1.06; font-weight: 800; letter-spacing: -0.025em;
    color: var(--ink); margin-top: 6px;
  }
  .hero-title .accent { color: var(--green); }
  .hero-sub { font-size: 17px; line-height: 1.6; color: var(--secondary); max-width: 540px; text-wrap: pretty; }

  .hero-cta { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 380px; }

  .trust-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; width: 100%; margin-top: 6px;
  }
  .trust-item { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
  .trust-icon {
    width: 46px; height: 46px; border-radius: 50%; background: var(--green-tint);
    display: flex; align-items: center; justify-content: center;
  }
  .trust-icon.danger { background: var(--danger-tint); }
  .trust-label { font-size: 12.5px; font-weight: 600; color: var(--secondary); line-height: 1.3; }

  .popular { width: 100%; margin-top: 14px; }
  .popular-title { font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 14px; }
  .popular-list { display: flex; flex-direction: column; gap: 10px; }
  .popular-card {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; text-align: left; font-size: 14.5px; font-weight: 500; color: var(--ink);
    transition: border-color .15s, box-shadow .15s, transform .1s;
  }
  .popular-card:hover { border-color: #bfe9d8; box-shadow: var(--shadow-soft); transform: translateY(-1px); }
  .popular-card:hover :last-child { stroke: var(--green); }

  /* ===================== LOGIN ===================== */
  .login-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card {
    width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border);
    border-radius: 24px; padding: 44px 40px; box-shadow: var(--shadow-card);
    display: flex; flex-direction: column;
  }
  .login-logo {
    display: flex; align-items: center; justify-content: center; gap: 11px; margin-bottom: 26px;
  }
  .login-logo span { font-size: 28px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
  .login-title { font-size: 26px; font-weight: 700; text-align: center; color: var(--ink); }
  .login-sub { font-size: 14.5px; color: var(--muted); text-align: center; margin-top: 8px; line-height: 1.5; max-width: 320px; align-self: center; }

  .field-label { font-size: 13.5px; font-weight: 600; color: var(--secondary); margin: 30px 0 9px; }
  .phone-field {
    display: flex; align-items: center; border: 1.5px solid var(--border-2); border-radius: 12px;
    overflow: hidden; transition: border-color .15s;
  }
  .phone-field.ok { border-color: var(--green); }
  .phone-cc {
    display: flex; align-items: center; gap: 7px; padding: 0 13px; height: 52px;
    border-right: 1px solid var(--border-2); font-size: 15px; font-weight: 600; color: var(--ink);
    background: var(--surface-2);
  }
  .phone-field input {
    flex: 1; height: 52px; border: none; outline: none; padding: 0 16px; font-size: 15.5px; color: var(--ink); background: transparent;
  }
  .phone-field input::placeholder { color: var(--faint); font-weight: 400; }

  .login-card .btn-primary { margin-top: 20px; }

  .or-divider { display: flex; align-items: center; gap: 14px; margin: 22px 0; color: var(--faint); font-size: 13px; }
  .or-divider::before, .or-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .btn-google {
    display: flex; align-items: center; justify-content: center; gap: 11px; width: 100%; height: 52px;
    background: var(--card); border: 1.5px solid var(--border-2); border-radius: 12px; font-size: 15px;
    font-weight: 600; color: var(--ink); transition: background .15s, border-color .15s;
  }
  .btn-google:hover { background: var(--surface-2); border-color: #cdd4de; }

  .secure-note { display: flex; align-items: center; gap: 7px; justify-content: center; margin-top: 22px; color: var(--muted); font-size: 12.5px; }

  /* ===================== CHAT ===================== */
  .chat { height: 100%; }
  .chat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--card);
    flex-shrink: 0;
  }
  .btn-newchat {
    display: flex; align-items: center; gap: 8px; color: var(--green); font-weight: 600; font-size: 14.5px;
    padding: 8px 14px; border-radius: 10px; transition: background .15s;
  }
  .btn-newchat:hover { background: var(--green-tint); }

  .chat-banner {
    background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 24px 14px;
    display: flex; flex-direction: column; gap: 12px; flex-shrink: 0;
  }
  .chips-row { display: flex; gap: 9px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
  .chips-row::-webkit-scrollbar { height: 0; }
  .chip {
    flex-shrink: 0; background: var(--chip-bg); color: var(--secondary); font-size: 13px; font-weight: 600;
    padding: 9px 16px; border-radius: 999px; white-space: nowrap; transition: background .15s, color .15s;
  }
  .chip:hover { background: var(--green-tint); color: var(--green-dark); }

  .chat-scroll { flex: 1; overflow-y: auto; background: var(--app-bg); }
  .chat-inner { max-width: 840px; margin: 0 auto; padding: 26px 24px 30px; display: flex; flex-direction: column; gap: 18px; }

  .row { display: flex; gap: 12px; align-items: flex-end; }
  .user-row { justify-content: flex-end; }
  .bot-row { justify-content: flex-start; }

  .avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .user-avatar { background: var(--green-tint); border: 1px solid var(--green-border); }
  .bot-avatar { background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-soft); }

  .bubble { border-radius: 20px; padding: 14px 17px; max-width: 560px; animation: rise .25s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .user-bubble { background: var(--green-tint-2); border: 1px solid var(--green-border); border-bottom-right-radius: 6px; }
  .bubble-text { font-size: 14.5px; line-height: 1.5; color: var(--ink); font-weight: 500; }
  .bubble-time { display: flex; align-items: center; gap: 5px; justify-content: flex-end; margin-top: 5px; font-size: 11px; color: var(--muted); }

  .bot-bubble { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 6px; box-shadow: var(--shadow-soft); }
  .ans-heading { font-size: 14.5px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  .ans-body { font-size: 14.5px; line-height: 1.6; color: var(--secondary); font-weight: 500; }
  .scheme-cat { font-size: 12.5px; font-weight: 600; color: var(--green-dark); margin-bottom: 10px; }

  .summary-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
  .summary-chip { background: var(--chip-bg); color: var(--secondary); font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; }

  .refusal-tag {
    display: inline-flex; align-items: center; gap: 6px; background: var(--danger-tint); color: var(--error);
    font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px; margin-bottom: 10px;
  }

  .source-card { margin-top: 13px; padding-top: 13px; border-top: 1px dashed var(--border-2); }
  .source-key { font-size: 12.5px; font-weight: 700; color: var(--ink); }
  .source-line { margin-bottom: 4px; }
  .source-link {
    display: inline-flex; align-items: center; gap: 6px; color: var(--blue); font-size: 13.5px;
    font-weight: 600; text-decoration: none; line-height: 1.4;
  }
  .source-link span { text-decoration: underline; text-underline-offset: 2px; }
  .source-link:hover { color: #1d579b; }
  .source-meta { font-size: 11.5px; color: var(--faint); margin-top: 6px; }

  .typing-bubble { display: flex; align-items: center; gap: 10px; }
  .typing-text { font-size: 13.5px; color: var(--muted); font-weight: 500; }
  .dots { display: flex; gap: 4px; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: blink 1.2s infinite both; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }

  /* empty state */
  .empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 40px 10px 10px; }
  .empty-logo { width: 76px; height: 76px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-card); display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
  .empty-title { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
  .empty-sub { font-size: 15px; line-height: 1.6; color: var(--muted); max-width: 460px; margin: 12px 0 28px; text-wrap: pretty; }
  .empty-examples { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; width: 100%; max-width: 640px; }
  .empty-ex {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 15px 17px;
    font-size: 13.5px; font-weight: 600; color: var(--ink); transition: border-color .15s, box-shadow .15s, transform .1s;
  }
  .empty-ex:hover { border-color: #bfe9d8; box-shadow: var(--shadow-soft); transform: translateY(-1px); }

  /* input */
  .chat-input-wrap { flex-shrink: 0; background: var(--card); border-top: 1px solid var(--border); padding: 16px 24px 14px; }
  .chat-input {
    max-width: 840px; margin: 0 auto; display: flex; align-items: center; gap: 10px;
    border: 1.5px solid var(--border-2); border-radius: 999px; padding: 6px 6px 6px 20px;
    transition: border-color .15s, box-shadow .15s;
  }
  .chat-input:focus-within { border-color: var(--green); box-shadow: 0 0 0 4px rgba(0,179,134,.08); }
  .chat-input input { flex: 1; border: none; outline: none; font-size: 15px; color: var(--ink); background: transparent; height: 40px; }
  .chat-input input::placeholder { color: var(--faint); }
  .send-btn {
    width: 44px; height: 44px; border-radius: 50%; background: var(--green); display: flex;
    align-items: center; justify-content: center; flex-shrink: 0; transition: background .15s, transform .1s;
  }
  .send-btn:hover { background: #009e76; }
  .send-btn:active { transform: scale(.94); }
  .send-btn:disabled { background: #b7e7d8; cursor: not-allowed; }
  .chat-foot-note { display: flex; align-items: center; gap: 7px; justify-content: center; margin-top: 12px; color: var(--faint); font-size: 12px; }

  /* ---------- responsive ---------- */
  @media (max-width: 600px) {
    .hero-title { font-size: 38px; }
    .hero-sub { font-size: 15.5px; }
    .trust-row { grid-template-columns: repeat(2, 1fr); gap: 18px 14px; }
    .hero-cta { max-width: 100%; }
    .empty-examples { grid-template-columns: 1fr; }
    .bubble { max-width: 78vw; }
    .nav, .landing-main { padding-left: 18px; padding-right: 18px; }
    .login-card { padding: 34px 24px; }
    .chat-inner { padding: 20px 16px 24px; }
    .chat-header, .chat-banner, .chat-input-wrap { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="knowledge.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="chat.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
